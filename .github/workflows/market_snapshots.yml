name: Market Snapshot and Shadow Totals

on:
  schedule:
    - cron: "0 15 * 1,8-12 *"
    # Closing-time refreshes on primary college-football game days (UTC).
    - cron: "0 12,16,20 * 8-12 4-6"
    - cron: "0 0 * 9-12 5,6,0"
  workflow_dispatch:
    inputs:
      season:
        description: "Optional season override"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ncaaf-market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Append snapshot
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ secrets.ODDS_API_IO_BOOKMAKERS }}
        run: |
          SEASON_FLAG=""
          if [ -n "${{ github.event.inputs.season }}" ]; then
            SEASON_FLAG="--season=${{ github.event.inputs.season }}"
          fi
          python scripts/snapshot_market.py $SEASON_FLAG --refresh-features
      - name: Refresh shadow CLV and release metadata
        run: |
          python scripts/settle_shadow_ledger.py
          python scripts/publish_release.py
          python scripts/audit_pipeline.py --strict --output data_files/audit_report.json
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data_files/raw/lines_*.json \
            data_files/raw/snapshots/ \
            data_files/processed/lines.parquet \
            data_files/processed/line_snapshots.parquet \
            data_files/features/feature_matrix.parquet \
            data_files/shadow_total_signals.json \
            data_files/processed/bet_ledger.parquet \
            data_files/releases/
          git diff --staged --quiet || git commit -m "data: market snapshot $(date -u '+%Y-%m-%dT%H:%MZ')"
          git push
