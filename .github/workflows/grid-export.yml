name: Sports Picks Grid export contract

on:
  pull_request:
    paths:
      - 'scripts/export_best_bets.py'
      - 'tests/test_grid_export.py'
      - '.github/workflows/grid-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow numpy scikit-learn joblib requests
      - run: python -m unittest discover -s tests -p test_grid_export.py -v
