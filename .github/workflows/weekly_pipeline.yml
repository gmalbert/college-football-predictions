name: Weekly Data Pipeline

on:
  schedule:
    # Every Tuesday at 6 AM UTC — football season only (Aug–Jan)
    - cron: "0 6 * 8 2"   # August   (week 0 / preseason)
    - cron: "0 6 * 9 2"   # September
    - cron: "0 6 * 10 2"  # October
    - cron: "0 6 * 11 2"  # November
    - cron: "0 6 * 12 2"  # December (conference championships / early bowls)
    - cron: "0 6 * 1 2"   # January  (bowl games / CFP)
  workflow_dispatch:
    inputs:
      force_repull:
        description: "Re-pull all data even if cached (--force)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      years:
        description: "Comma-separated seasons (blank = dynamic five completed + live season)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  data-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      # ── Python setup ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run predictive-core tests
        run: python -m unittest discover -s tests -v

      # ── pull data ────────────────────────────────────────────────────────────
      - name: Fetch historical data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_repull }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          YEARS_FLAG=""
          if [ -n "${{ github.event.inputs.years }}" ]; then
            YEARS_FLAG="--years=${{ github.event.inputs.years }}"
          fi
          python -m utils.fetch_historical $FORCE_FLAG $YEARS_FLAG

      - name: Capture sportsbook snapshot
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_IO_BOOKMAKERS: ${{ secrets.ODDS_API_IO_BOOKMAKERS }}
        run: python scripts/snapshot_market.py
        continue-on-error: true

      # ── build features ───────────────────────────────────────────────────────
      - name: Build feature matrix
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m utils.feature_engine --force

      # ── retrain models ───────────────────────────────────────────────────────
      - name: Train prediction models
        run: python -m utils.models --force

      # ── export best bets ─────────────────────────────────────────────────────
      - name: Export best bets for Sports Picks Grid
        run: python scripts/export_best_bets.py
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Export prospective shadow total signals
        run: python scripts/export_shadow_totals.py

      - name: Publish coherent release metadata
        run: python scripts/publish_release.py

      - name: Enforce data and evaluation contracts
        run: python scripts/audit_pipeline.py --strict --output data_files/audit_report.json

      # ── commit artifacts ─────────────────────────────────────────────────────
      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            data_files/raw/ \
            data_files/processed/ \
            data_files/features/ \
            data_files/models/ \
            data_files/audit_report.json \
            data_files/releases/ \
            data_files/best_bets_today.json \
            data_files/shadow_total_signals.json
          git diff --staged --quiet || \
            git commit -m "chore: weekly data pipeline $(date -u '+%Y-%m-%d')"
          git push
